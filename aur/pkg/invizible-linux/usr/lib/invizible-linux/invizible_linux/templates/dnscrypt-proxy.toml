# Generado por InviZible Linux.
listen_addresses = ['127.0.0.1:5354']
server_names = [@SERVERS@]
max_clients = 250
ipv4_servers = true
ipv6_servers = false
dnscrypt_servers = true
doh_servers = true
odoh_servers = false
require_dnssec = true
require_nolog = true
require_nofilter = @NOFILTER@
force_tcp = false
timeout = 5000
keepalive = 30
lb_strategy = 'p2c'
lb_estimator = true
block_ipv6 = true
block_unqualified = true
block_undelegated = true
reject_ttl = 600
cache = true
cache_size = 4096
cache_min_ttl = 2400
cache_max_ttl = 86400
cache_neg_min_ttl = 60
cache_neg_max_ttl = 600
netprobe_timeout = 60
log_file = '@LOGFILE@'
log_level = 2
use_syslog = false

[sources]
  [sources.public-resolvers]
    urls = [
      'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md',
      'https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md',
    ]
    cache_file = '@CACHE_DIR@/public-resolvers.md'
